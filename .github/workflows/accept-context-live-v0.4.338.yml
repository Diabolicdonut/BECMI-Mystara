name: One-time v0.4.338 acceptance ledger
on:
  push:
    branches: ['work/v0.4.338']
    paths: ['.github/workflows/accept-context-live-v0.4.338.yml','tools/accept-context-live-v0.4.338.mjs']
permissions:
  contents: write
jobs:
  accept:
    if: github.event.head_commit.message == 'Request v0.4.338 accepted ledger after candidate gate'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Record only qualified immutable production acceptance
        run: |
          node tools/accept-context-live-v0.4.338.mjs
      - name: Commit acceptance ledger only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit.md pipeline-state.md validation/manifests/v0.4.338.json validation/README.md
          git diff --cached --check
          git commit -m "Accept v0.4.338 production metadata after ten green candidate checks; main pending"
          git push origin HEAD:refs/heads/work/v0.4.338
