name: One-time v0.4.338 missile and save/reload extension
on:
  push:
    branches: ['work/v0.4.338']
    paths: ['.github/workflows/extend-context-live-v0.4.338.yml']
permissions:
  contents: write
jobs:
  extend:
    if: github.event.head_commit.message == 'Request bounded v0.4.338 missile integration extension'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch exactly one accepted v0.4.338 candidate source
        run: |
          node tools/extend-context-live-v0.4.338.mjs
          node --check validation/context-matrix-live.mjs
      - name: Commit candidate extension, never accepted main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pipeline-state.md validation/manifests/v0.4.338.json validation/context-matrix-live.mjs validation/README.md
          git diff --cached --check
          git commit -m "Extend v0.4.338 candidate with ranged contextual damage and real save/reload tests — NOT ACCEPTED"
          git push origin HEAD:refs/heads/work/v0.4.338
