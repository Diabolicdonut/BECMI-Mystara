name: One-time Known World title branding
on:
  push:
    branches: ['work/the-known-world-branding-20261028']
    paths: ['.github/workflows/one-time-known-world-branding-20261028.yml']
permissions:
  contents: write
jobs:
  brand:
    if: github.ref == 'refs/heads/work/the-known-world-branding-20261028'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply four verified display-only changes and update production checksum
        run: |
          node tools/one-time-known-world-branding-20261028.mjs
          npm ci --ignore-scripts
          npm run validate:syntax
          node validation/roadmap-governance.mjs
      - name: Commit branding only and remove one-time helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-known-world-branding-20261028.yml tools/one-time-known-world-branding-20261028.mjs
          git add index.html validation/manifests/v0.4.348.json validation/roadmap-playable-status.mjs
          git diff --cached --check
          git commit -m "Brand the game The Known World; retain Lan Yu adventure"
          git push origin HEAD:refs/heads/work/the-known-world-branding-20261028
