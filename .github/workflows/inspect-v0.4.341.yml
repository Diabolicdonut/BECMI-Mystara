name: Inspect v0.4.341 initiative and combat mode
on:
  push:
    branches: ['work/v0.4.341-original-die-size-measure']
    paths: ['.github/workflows/inspect-v0.4.341.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Print bounded source inspection without changing production
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text()
          markers=['function rollInitiative','function rollSideInitiative','function resolveInitiative','function beginRound','function nextRound','initiative =','initiative=','initiative:', '.initiative =','.initiative=', 'rolls:', 'rolls =', 'rolls=', 'initiativeBonuses','initiativeBonus','initiativeModifier', 'rollDie(6)', 'd6()', 'die(6)', 'rnd(6)', 'randInt(1,6)', 'roll(6)', 'dice(1,6)', 'rollD6()', 'function activeRulesProfile','function rollInitiativeForSide', 'function calculateInitiative','function ensureBecmRuleOptions']
          lines=s.splitlines()
          for needle in markers:
              hits=[i for i,line in enumerate(lines) if needle in line]
              print('\\n### MARKER '+repr(needle)+' occurrences '+str(len(hits)),flush=True)
              for i in hits[:12]:
                  lo=max(0,i-5);hi=min(len(lines),i+32 if needle.startswith('function ') else i+5)
                  print('\\n'.join(f'{j+1}: {lines[j][:260]}' for j in range(lo,hi)),flush=True)
          a=Path('audit.md').read_text().splitlines()
          print('\\n### AUDIT HEAD\\n'+'\\n'.join(a[:35]),flush=True)
          print('\\n### HTML SIZE '+str(len(s)),flush=True)
