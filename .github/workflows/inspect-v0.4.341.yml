name: Inspect v0.4.341 initiative and combat mode
on:
  push:
    branches: ['work/v0.4.341-original-die-size-measure']
    paths: ['.github/workflows/inspect-v0.4.341.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Print bounded source inspection without changing production
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text()
          lines=s.splitlines()
          needles=['function rollCombatInitiativeSides(', 'function initiativeModifier', 'function initiativeRollForSide(', 'function beginCombat', 'function startCombat', 'function resolveCombatRound(', 'function ensureBecmRuleOptions(', 'function applyRulesProfile(', 'function setInitiativeMode(', 'function refreshSpatialEngagements(']
          for needle in needles:
              hits=[i for i,line in enumerate(lines) if needle in line]
              print('\\n### '+repr(needle)+' hits='+str(len(hits)),flush=True)
              for i in hits[:2]:
                  hi=min(len(lines),i+95)
                  print('\\n'.join(f'{j+1}: {lines[j][:400]}' for j in range(max(0,i-3),hi)),flush=True)
          a=Path('audit.md').read_text().splitlines()
          print('\\n### AUDIT HEAD\\n'+'\\n'.join(a[:35]),flush=True)
          print('\\n### HTML SIZE '+str(len(s)),flush=True)
