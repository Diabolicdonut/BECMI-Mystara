name: Known World acceptance

on:
  push:
    branches: [main, 'work/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: known-world-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/work/') }}

jobs:
  deterministic:
    name: Deterministic ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [core, focused]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run validate:syntax
      - run: node validation/run-local.mjs ${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deterministic-${{ matrix.suite }}
          path: validation/results/
          if-no-files-found: error

  chromium:
    name: Fresh Chromium slice ${{ matrix.slice }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node validation/browser-run.mjs slice ${{ matrix.slice }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-${{ matrix.slice }}
          path: validation/results/
          if-no-files-found: error

  native-smoke:
    name: Exact production boot and supplemental native save/reload
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Required v0.4.342 RAW/contextual native combat mode and full original Measure matrix
        run: node validation/combat-procedure-native-v0.4.342.mjs
      - name: Required native pairwise Measure, six-goblin swarm and save reload
        run: node validation/measure-pairwise-live-v0.4.340.mjs
      - run: npm run validate:native-smoke
      - run: node validation/context-matrix-mode.mjs
      - run: node validation/context-matrix-calculator.mjs
      - run: node validation/context-matrix-live.mjs
      - name: Required live symmetrical measure and monster resolution checks
        run: node validation/measure-control-live-v0.4.339.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-smoke
          path: validation/results/
          if-no-files-found: error

  established-native:
    name: Required Native Acceptance v2
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: git fetch origin 9f1b4832def3e3cabf923b702d8117b445201ce8
      - run: git show 9f1b4832def3e3cabf923b702d8117b445201ce8:index.html > /tmp/known-world-accepted-v0.4.333.html
      - run: node validation/native-v2.mjs /tmp/known-world-accepted-v0.4.333.html native-v2-v0.4.333
      - run: npm run validate:native-v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: established-native
          path: validation/results/
          if-no-files-found: error

  ordered-coverage:
    name: Ordered once-only coverage and isolation
    needs: [deterministic, chromium, native-smoke, established-native]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          path: validation/results/
          merge-multiple: true
      - run: npm run validate:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ordered-coverage
          path: validation/results/coverage.json
          if-no-files-found: error

  required-acceptance:
    name: Required acceptance gate
    needs: [deterministic, chromium, native-smoke, established-native, ordered-coverage]
    if: always()
    runs-on: ubuntu-24.04
    env:
      JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Every required procedure must pass
        run: |
          node -e 'const jobs=JSON.parse(process.env.JOB_RESULTS); const failed=Object.entries(jobs).filter(([,j])=>j.result!=="success"); if(failed.length){console.error("Acceptance blocked:",failed.map(([name,j])=>`${name}: ${j.result}`).join(", "));process.exit(1);} console.log("All required procedures passed; acceptance audit/pipeline update and reviewed merge are still required.");'
