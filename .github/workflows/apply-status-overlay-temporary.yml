name: Patch Known World status indicator (temporary)
on:
  push:
    branches:
      - work/progress-widget-main-game-20261027
    paths:
      - .github/workflows/apply-status-overlay-temporary.yml
permissions:
  contents: write
jobs:
  append-status-widget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Append existing shared revision and roadmap indicator to main playable page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          raw = p.read_text(encoding='utf-8')
          assert len(raw) > 1_000_000, 'Never replace the accepted monolithic game with a short placeholder'
          marker = '<script defer src="./site-progress.js" data-site-progress></script>'
          if marker not in raw:
              assert raw.count('</body>') == 1, 'Unexpected body layout'
              raw = raw.replace('</body>', marker + '\n</body>', 1)
              p.write_text(raw, encoding='utf-8')
          assert marker in p.read_text(encoding='utf-8')
          PY
      - name: Commit only the one-line widget installation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Load roadmap status on Known World playable homepage"
          git push origin HEAD:work/progress-widget-main-game-20261027
