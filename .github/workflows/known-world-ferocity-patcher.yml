name: Known World v0.4.347 branch-only patch
on:
  push:
    branches: ['work/v0.4.347-ferocity']
    paths:
      - 'tools/ferocity-patch-v0.4.347.mjs'
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/ferocity-patch-v0.4.347.mjs
      - name: Commit only bounded candidate changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html validation/manifests/v0.4.347.json
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "feat(v0.4.347): source-reviewed Ferocity and regression definitions"
          git push origin HEAD:work/v0.4.347-ferocity
