name: One-time v0.4.338 source inspection
on:
  push:
    branches: ['work/v0.4.338']
    paths: ['.github/workflows/inspect-combat-v0.4.338.yml', 'tools/inspect-combat-v0.4.338.mjs']
permissions:
  contents: write
jobs:
  inspect:
    if: github.event.head_commit.message == 'Request v0.4.338 combat source inspection'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/inspect-combat-v0.4.338.mjs
      - name: Commit source findings only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find validation/candidate-v0.4.338 -type f -name '*.md' -exec sed -i 's/[[:blank:]]*$//' {} +
          find validation/candidate-v0.4.338 -type f -name '*.md' -exec sed -i '${/^$/d;}' {} +
          git add validation/candidate-v0.4.338/
          git diff --cached --check
          git commit -m "Record v0.4.338 scoped combat inspection"
          git push origin HEAD:refs/heads/work/v0.4.338
