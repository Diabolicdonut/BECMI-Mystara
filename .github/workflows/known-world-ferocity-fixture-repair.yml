name: Known World v0.4.347 bounded fixture integrity repair
on:
  push:
    branches: ['work/v0.4.347-ferocity']
    paths: ['.github/workflows/known-world-ferocity-fixture-repair.yml']
permissions:
  contents: write
jobs:
  fixture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v0.4.347-ferocity
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Repair source-backed fixture and migration test state references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          replacements=[
            ("if(type==='wolf')state.combat.monsters=Array.from({length:count},(_,i)=>createCombatMonster('wolf',i+1));",
             "if(type==='wolf'||type==='berserker')state.combat.monsters=Array.from({length:count},(_,i)=>createCombatMonster(type,i+1));"),
            ("          mon.measureTraits=value;\n          harnessAssert(!measureCreatureFerocious(mon)&&!meleeControlFerocityContext(group,'normal').bonus.foes,'Invalid override became true');",
             "          const current=state.combat.monsters.find(m=>m.id===mon.id);current.measureTraits=value;\n          harnessAssert(!measureCreatureFerocious(current)&&!meleeControlFerocityContext(group,'normal').bonus.foes,'Invalid override became true');"),
            ("        delete mon.measureTraits;\n        const loaded=migrateSave(harnessClone(state));\n        harnessAssert(measureCreatureFerocious(mon)&&!Object.prototype.hasOwnProperty.call(loaded.combat.monsters[0],'measureTraits')",
             "        const current=state.combat.monsters.find(m=>m.id===mon.id);delete current.measureTraits;\n        const loaded=migrateSave(harnessClone(state));\n        harnessAssert(measureCreatureFerocious(current)&&!Object.prototype.hasOwnProperty.call(loaded.combat.monsters[0],'measureTraits')"),
            ("          if(value===undefined)delete mon.measureTraits;else mon.measureTraits=value;\n          const loaded=migrateSave(migrateSave(harnessClone(state))),stored=loaded.combat.monsters.find(m=>m.id===mon.id);",
             "          const current=state.combat.monsters.find(m=>m.id===mon.id);\n          if(value===undefined)delete current.measureTraits;else current.measureTraits=value;\n          const loaded=migrateSave(migrateSave(harnessClone(state))),stored=loaded.combat.monsters.find(m=>m.id===mon.id);")
          ]
          for old,new in replacements:
            if s.count(old)!=1:raise RuntimeError('Unexpected fixture anchor: '+old[:90])
            s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Refresh exact manifest production hash without changing validation requirements
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';import {createHash} from 'node:crypto';
          const file='validation/manifests/v0.4.347.json',m=JSON.parse(fs.readFileSync(file,'utf8'));
          if(m.version!=='0.4.347'||m.core.length<2350)throw Error('Unexpected manifest');
          m.productionSha256=createHash('sha256').update(fs.readFileSync('index.html')).digest('hex');
          fs.writeFileSync(file,JSON.stringify(m,null,2)+'\n');
          JS
      - name: Commit bounded fixture correction
        run: |
          git config user.name known-world-ci
          git config user.email known-world-ci@users.noreply.github.com
          git add index.html validation/manifests/v0.4.347.json
          git diff --cached --check
          git commit -m "test(v0.4.347): exercise source-backed berserker and current migrated actors"
          git push origin HEAD:work/v0.4.347-ferocity
