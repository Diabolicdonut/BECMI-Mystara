name: Apply bounded v0.4.342 candidate patch
on:
  push:
    branches: ['work/v0.4.342-pure-becmi-raw-combat']
    paths:
      - 'validation/apply-v0.4.342.mjs'
      - '.github/workflows/apply-v0.4.342.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply exact source-pinned v0.4.342 production edit
        run: node validation/apply-v0.4.342.mjs
      - name: Commit bounded candidate production HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'v0.4.342 candidate: independently selectable pure RAW combat mechanics'
          git push origin HEAD:work/v0.4.342-pure-becmi-raw-combat
