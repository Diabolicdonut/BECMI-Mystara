name: One-time Known World roadmap header sync
on:
  push:
    branches:
      - work/authoritative-roadmap-and-in-game-progress
    paths:
      - .github/workflows/roadmap-header-sync.yml
      - tools/sync-progress-status.mjs

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate offline badge and matching exact source checksum
        run: |
          node tools/sync-progress-status.mjs
          node tools/sync-progress-status.mjs --check
          git diff --check
          git status --short
      - name: Commit only the self-contained site header and manifest
        run: |
          git add index.html validation/manifests/v0.4.347.json
          if git diff --cached --quiet; then
            echo "Already synchronized"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ui: show accepted version and whole-product completion in game header'
          git push origin 'HEAD:work/authoritative-roadmap-and-in-game-progress'
