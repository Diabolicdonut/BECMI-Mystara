name: One-time The Known World title amendment
on:
  push:
    branches: ['work/branding-the-known-world-20261028']
permissions:
  contents: write
jobs:
  apply-source-preserving-branding:
    if: ${{ !contains(github.event.head_commit.message, '[branding automation]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply four exact game title changes and synchronized metadata
        run: node tools/apply-known-world-title-once.mjs
      - name: Confirm whitespace and changed files
        run: git diff --check
      - name: Drop one-time automation files from resulting PR
        run: git rm -- tools/apply-known-world-title-once.mjs .github/workflows/branding-the-known-world-once.yml
      - name: Commit branding correction on work branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html play.html status.html validation/manifests/v0.4.348.json validation/static-checks.mjs audit.md pipeline-state.md
          git commit -m "Present The Known World as game title; preserve Lan Yu [branding automation]"
          git push origin HEAD:work/branding-the-known-world-20261028
