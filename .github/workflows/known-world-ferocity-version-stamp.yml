name: Known World v0.4.347 version stamp
on:
  push:
    branches: ['work/v0.4.347-ferocity']
    paths: ['tools/ferocity-version-stamp.mjs']
permissions:
  contents: write
jobs:
  stamp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/ferocity-version-stamp.mjs
      - name: Commit exact production/manifest stamp
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html validation/manifests/v0.4.347.json
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "fix(v0.4.347): align production version and checksum"
          git push origin HEAD:work/v0.4.347-ferocity
