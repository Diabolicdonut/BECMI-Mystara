name: Build v0.4.348 natural proximity candidate
on:
  push:
    branches: ['work/v0.4.348-natural-proximity']
    paths: ['tools/build-natural-proximity-v0.4.348.mjs','.github/workflows/build-natural-proximity-v0.4.348.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply source-pinned patch on GitHub runner
        run: |
          node --check tools/build-natural-proximity-v0.4.348.mjs
          node tools/build-natural-proximity-v0.4.348.mjs
          npm ci --ignore-scripts
          npm run validate:syntax
      - name: Push unaccepted candidate on work branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html validation/manifests/v0.4.348.json audit.md pipeline-state.md validation/README.md
          git diff --cached --check
          git commit -m "Build unaccepted v0.4.348 natural physical proximity candidate"
          git push origin HEAD:refs/heads/work/v0.4.348-natural-proximity
