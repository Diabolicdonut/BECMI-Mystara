name: Stage v0.4.341 acceptance metadata
on:
  push:
    branches: ['work/v0.4.341-original-die-size-measure']
    paths: ['.github/workflows/stage-measure-acceptance-v0.4.341.yml']
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Stage acceptance against exact already-qualified production
        run: python3 tools/stage-measure-acceptance-v0.4.341.py
      - name: Validate immutable game and accepted ledger alignment
        run: |
          git diff --check
          node validation/static-checks.mjs
          git diff --stat
      - name: Record accepted metadata on work branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit.md pipeline-state.md validation/manifests/v0.4.341.json
          git diff --cached --check
          git commit -m "v0.4.341 — Stage exact-SHA accepted Measure audit and pipeline metadata"
          git push origin HEAD:work/v0.4.341-original-die-size-measure
