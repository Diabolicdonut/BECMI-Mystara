name: One-time Context Matrix candidate builder
on:
  push:
    branches: [work/v0.4.335]
permissions:
  contents: write
jobs:
  build-candidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply bounded v0.4.335 production patch if needed
        run: |
          if ! grep -q "const APP_VERSION='0.4.335'" index.html; then
            node tools/patch-context-matrix-v0.4.335.mjs
          fi
      - name: Snapshot exact candidate regression manifest if needed
        run: |
          if [ ! -f validation/manifests/v0.4.335.json ]; then
            node --input-type=module -e "
              import fs from 'node:fs';
              import {createHash} from 'node:crypto';
              const m=JSON.parse(fs.readFileSync('validation/manifests/v0.4.334.json','utf8'));
              m.version='0.4.335';m.acceptedVersion='0.4.334';
              m.productionSha256=createHash('sha256').update(fs.readFileSync('index.html')).digest('hex');
              fs.writeFileSync('validation/manifests/v0.4.335.json',JSON.stringify(m,null,2)+'\n');
            "
          fi
      - name: Repair exactly one inherited default-regression expectation
        run: node tools/repair-context-matrix-test-v0.4.335.mjs
      - name: Commit only bounded candidate artifacts
        run: |
          if [ -n "$(git status --porcelain -- index.html validation/manifests/v0.4.335.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html validation/manifests/v0.4.335.json
            git commit -m "v0.4.335 candidate — RAW-default regression expectation and exact hash"
            git push origin HEAD:work/v0.4.335
          fi
