name: Known World v0.4.347 bounded Ferocity identity repair
on:
  push:
    branches: ['work/v0.4.347-ferocity']
    paths: ['.github/workflows/known-world-ferocity-repair.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v0.4.347-ferocity
          persist-credentials: true
      - name: Fix canonical wolf provenance without changing any tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          f=Path('index.html')
          s=f.read_text()
          before="    wolf:{recordId:'MON-0104',sourcePage:39},"
          after="    wolf_normal:{recordId:'MON-0104',sourcePage:39},"
          if s.count(before)!=1: raise RuntimeError('Unrecognized wolf provenance; fail closed')
          f.write_text(s.replace(before,after))
          PY
      - name: Commit only bounded source identity correction
        run: |
          git config user.name "known-world-ci"
          git config user.email "known-world-ci@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "fix(v0.4.347): align wolf Ferocity with canonical wolf_normal identity"
          git push origin HEAD:work/v0.4.347-ferocity
