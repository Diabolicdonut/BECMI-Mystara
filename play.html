<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Known World — Play with Roadmap Status</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:#11191e;color:#ebeff0}
header{flex:none;display:flex;align-items:center;flex-wrap:wrap;gap:clamp(.5rem,1.5vw,1rem);padding:.45rem .85rem;border-bottom:1px solid #667780;background:#17252d}
.brand{font-size:1rem;font-weight:700;white-space:nowrap}
nav{display:flex;flex-wrap:wrap;gap:.65rem;font-size:.8rem}
nav a{color:#e9d49d}
nav a:focus-visible,iframe:focus-visible{outline:2px solid #e9d49d}
.overview{display:flex;align-items:stretch;gap:.5rem;flex:1 1 530px}
.overview>div{flex:1 1 0;min-width:0;border:1px solid #3e535b;padding:.28rem .5rem;border-radius:5px;background:#213039}
.overview h2{font-size:.69rem;line-height:1.3;letter-spacing:.02em;font-weight:600;text-transform:uppercase;color:#b9c8cb;margin:0 0 .12rem}
.overview p{font-size:.86rem;line-height:1.3;font-weight:650;color:#f0dba8;margin:0;overflow-wrap:anywhere}
.overview p+p{font-size:.75rem;color:#c8d4d7;font-weight:400}
.game-frame{flex:1 1 auto;min-height:150px;width:100%;border:0;background:#11191e;display:block}
#project-progress-status{bottom:8px;right:8px}
@media(max-width:620px){header{align-items:flex-start}.brand{font-size:.9rem}.overview{order:3;flex-basis:100%}.overview h2{font-size:.64rem}.overview p{font-size:.75rem}nav{margin-left:auto}.overview>div{padding:.25rem .35rem}}
@media print{header{display:none}}
</style>
</head>
<body>
<header>
<strong class="brand">Known World / BECMI</strong>
<nav aria-label="Game and roadmap links">
<a href="./index.html">Full-screen game</a>
<a href="./status.html">Full project status</a>
<a href="./ROADMAP-COVERAGE.md">Roadmap</a>
</nav>
<div class="overview" data-progress-overview aria-label="Accepted revision and roadmap status" aria-live="polite">
<div><h2>Accepted revision</h2><p>Loading…</p></div>
<div><h2>Whole-project progress</h2><p>Loading…</p></div>
<div><h2>Current milestone</h2><p>Loading…</p></div>
</div>
</header>
<iframe id="game" class="game-frame" title="Known World role-playing game" src="./index.html" loading="eager" referrerpolicy="same-origin"></iframe>
<script defer src="./site-progress.js" data-site-progress></script>
</body>
</html>
